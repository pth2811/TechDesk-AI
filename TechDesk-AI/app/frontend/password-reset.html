<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | TechDesk AI</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .alert-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .alert-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="brand-logo" style="margin: 0 auto 12px auto;">TD</div>
                <h2>Reset Password</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Enter your email or verification token</p>
            </div>

            <div id="alertBox" class="alert-box"></div>

            <!-- Form 1: Request Token -->
            <form id="requestForm">
                <div class="form-group">
                    <label for="email">Corporate Email</label>
                    <input type="email" id="email" class="form-control" placeholder="username@company.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Token &rarr;</button>
            </form>

            <!-- Form 2: Enter Token & New Password -->
            <form id="resetForm" style="display: none; margin-top: 20px;">
                <div class="form-group">
                    <label for="token">Reset Token</label>
                    <input type="text" id="token" class="form-control" placeholder="Paste reset token here" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password &rarr;</button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                Remembered your credentials? <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const prefillToken = urlParams.get("token");

        if (prefillToken) {
            document.getElementById("requestForm").style.display = "none";
            document.getElementById("resetForm").style.display = "block";
            document.getElementById("token").value = prefillToken;
        }

        const alertBox = document.getElementById("alertBox");

        document.getElementById("requestForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();

            try {
                const res = await fetch("/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                alertBox.className = "alert-box success";
                alertBox.textContent = data.message + (data.demo_token ? ` Demo Token: ${data.demo_token}` : "");

                document.getElementById("requestForm").style.display = "none";
                document.getElementById("resetForm").style.display = "block";
                if (data.demo_token) {
                    document.getElementById("token").value = data.demo_token;
                }
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Error submitting request.";
            }
        });

        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = document.getElementById("token").value.trim();
            const new_password = document.getElementById("newPassword").value;

            try {
                const res = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.className = "alert-box error";
                    alertBox.textContent = data.detail || "Failed to reset password.";
                    return;
                }

                alertBox.className = "alert-box success";
                alertBox.textContent = data.message;
                setTimeout(() => window.location.replace("/"), 1500);
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Error processing password reset.";
            }
        });
    </script>
</body>
</html>
